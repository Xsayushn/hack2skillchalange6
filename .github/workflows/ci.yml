name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test, A11y & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 1. Install dependencies
      run: npm ci

    - name: 2. Run ESLint code quality check
      run: npm run lint

    - name: 3. Run Prettier formatting check
      run: npm run format:check

    - name: 4. Run Vitest automated unit test suite
      run: npm test

    - name: 5. Run axe-core accessibility checks
      run: npm run test:a11y

    - name: 6. Run strict TypeScript verification & production build
      run: npm run build
